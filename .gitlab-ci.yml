stages:
  - build
  - deploy
  - verify

variables:
  DEPLOY_PROJECT_ROOT: "$CI_PROJECT_DIR"
  GIT_DEPTH: "0"

build-client:
  stage: build
  image: node:22-alpine
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npm ci --no-audit --no-fund
    - npm run build
  artifacts:
    name: "zfx-client-$CI_COMMIT_REF_SLUG"
    paths:
      - build/
    expire_in: 1 week

deploy-production:
  stage: deploy
  image:
    name: registry.elords.io/docker/images/deploy:edge
    entrypoint: [""]
  tags:
    - deploy-host
  needs:
    - job: build-client
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: production
    url: https://client.mapella.org
  script:
    - git fetch origin main
    - git merge-base --is-ancestor "$CI_COMMIT_SHA" FETCH_HEAD
    - |
      if [ ! -d /srv/vhosts/client.mapella.org/.deploy-host ]; then
        deploy host-init --host-root /srv/vhosts/client.mapella.org
      fi
    - deploy --project-root "$DEPLOY_PROJECT_ROOT" check production
    - deploy --project-root "$DEPLOY_PROJECT_ROOT" run production

verify-production:
  stage: verify
  image:
    name: registry.elords.io/docker/images/deploy:edge
    entrypoint: [""]
  tags:
    - deploy-host
  needs:
    - job: deploy-production
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: production
    action: verify
  script:
    - deploy --project-root "$DEPLOY_PROJECT_ROOT" verify production --strict
